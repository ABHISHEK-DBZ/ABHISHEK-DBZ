<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0c1738" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glowOrbit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes solarPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .spin-ring {
        transform-origin: 256px 200px;
        animation: orbitRotate 12s linear infinite;
      }
      .sun-core {
        transform-origin: 256px 200px;
        animation: solarPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGradOrbit)" />
  <rect width="504" height="504" x="4" y="4" rx="34" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.35" />

  <!-- Stars -->
  <circle cx="80" cy="90" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="430" cy="110" r="2" fill="#00f0ff" opacity="0.8" />
  <circle cx="390" cy="280" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="95" cy="340" r="1.8" fill="#8b5cf6" opacity="0.7" />

  <!-- Central Aditya-L1 Sun & Orbit -->
  <g class="sun-core" filter="url(#glowOrbit)">
    <circle cx="256" cy="200" r="50" fill="url(#sunGrad)" />
    <circle cx="256" cy="200" r="62" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
  </g>

  <!-- Orbit Rings -->
  <g class="spin-ring">
    <ellipse cx="256" cy="200" rx="110" ry="38" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />
    <circle cx="366" cy="200" r="6" fill="#00f0ff" filter="url(#glowOrbit)" />
    <circle cx="146" cy="200" r="4" fill="#ffffff" />
  </g>

  <!-- Satellite Silhouette -->
  <g transform="translate(366, 200) rotate(25)">
    <rect x="-8" y="-4" width="16" height="8" rx="2" fill="#030712" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="-16" y1="0" x2="-8" y2="0" stroke="#00f0ff" stroke-width="2" />
    <line x1="8" y1="0" x2="16" y2="0" stroke="#00f0ff" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="256" y="375" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">ORBIT // ISRO</text>
  <text x="256" y="410" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="18" fill="#f59e0b" text-anchor="middle" letter-spacing="3">ADITYA-L1 SPACE WEATHER AI</text>
  <text x="256" y="448" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="2">SOLAR FLARE NOWCASTING &amp; PHYSICS ML</text>
</svg>
