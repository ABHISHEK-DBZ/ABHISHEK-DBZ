<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="100%" height="40" fill="none">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="85%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes scanLaser {
        0% { transform: translateX(-300px); }
        50% { transform: translateX(1100px); }
        100% { transform: translateX(-300px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .laser-motion {
        animation: scanLaser 6s ease-in-out infinite;
      }
      .pulse-node {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Grid Line -->
  <line x1="50" y1="20" x2="1150" y2="20" stroke="url(#dividerGrad)" stroke-width="1.5" />

  <!-- Center Diamond & Brackets -->
  <g transform="translate(600, 20)" class="pulse-node" filter="url(#neonGlow)">
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#00f0ff" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
    <path d="M -25,-8 L -35,0 L -25,8" stroke="#8b5cf6" stroke-width="1.5" fill="none" />
    <path d="M 25,-8 L 35,0 L 25,8" stroke="#8b5cf6" stroke-width="1.5" fill="none" />
  </g>

  <!-- Ticks -->
  <line x1="200" y1="16" x2="200" y2="24" stroke="#00f0ff" stroke-width="1" opacity="0.6" />
  <line x1="400" y1="17" x2="400" y2="23" stroke="#8b5cf6" stroke-width="1" opacity="0.6" />
  <line x1="800" y1="17" x2="800" y2="23" stroke="#8b5cf6" stroke-width="1" opacity="0.6" />
  <line x1="1000" y1="16" x2="1000" y2="24" stroke="#00f0ff" stroke-width="1" opacity="0.6" />

  <!-- Scanning Laser Beam -->
  <rect x="0" y="18.5" width="220" height="3" fill="url(#laserBeam)" class="laser-motion" filter="url(#neonGlow)" />
</svg>
