<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="34" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.35" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Central Agri-AI Icon -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Circuit rings -->
    <circle r="110" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle r="85" fill="#031f18" stroke="#10b981" stroke-width="2.5" />

    <!-- Sprout / Leaf & Neural Circuit -->
    <path d="M 0,55 C 0,55 -55,10 -35,-45 C -20,-85 25,-85 45,-55 C 65,-25 35,25 0,55 Z" fill="url(#neonGlow)" opacity="0.9" />
    <path d="M 0,55 Q -5,-15 35,-55" fill="none" stroke="#030712" stroke-width="3" stroke-linecap="round" />
    
    <!-- Circuit Nodes -->
    <circle cx="-15" cy="-20" r="4.5" fill="#00f0ff" />
    <circle cx="20" cy="-10" r="4" fill="#00f0ff" />
    <circle cx="10" cy="-40" r="3.5" fill="#ffffff" />
    <line x1="-15" y1="-20" x2="0" y2="10" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="20" y1="-10" x2="0" y2="10" stroke="#00f0ff" stroke-width="1.5" />
    <line x1="10" y1="-40" x2="20" y2="-10" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Title & Subtitle -->
  <text x="256" y="380" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">SMART KRISHI</text>
  <text x="256" y="414" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="19" fill="#34d399" text-anchor="middle" letter-spacing="4">SAHAYAK</text>
  <text x="256" y="450" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="2">AI-POWERED AGRI INTELLIGENCE</text>
</svg>

