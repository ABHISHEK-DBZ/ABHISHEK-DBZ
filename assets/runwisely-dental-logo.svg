<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDental" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="neonGlowDental" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glowDental" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGradDental)" />
  <rect width="504" height="504" x="4" y="4" rx="34" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.35" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>

  <!-- Central Tooth & Pulse Waveform Icon -->
  <g transform="translate(256, 210)" filter="url(#glowDental)">
    <!-- Circuit rings -->
    <circle r="110" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle r="85" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Stylized Tooth Silhouette -->
    <path d="M -38,-45 C -48,-15 -42,20 -30,55 C -22,48 -12,28 -5,12 C 0,35 12,48 25,55 C 38,20 45,-15 35,-45 C 28,-65 -28,-65 -38,-45 Z" fill="url(#neonGlowDental)" opacity="0.95" />

    <!-- Pulse line across -->
    <path d="M -60,0 L -25,0 L -12,-20 L 5,22 L 18,-10 L 30,0 L 60,0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="256" y="380" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">RUNWISELY</text>
  <text x="256" y="414" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="19" fill="#38bdf8" text-anchor="middle" letter-spacing="4">DENTAL AI</text>
  <text x="256" y="450" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#c084fc" text-anchor="middle" letter-spacing="2">CLINICAL WORKFLOW AUTOMATION</text>
</svg>

