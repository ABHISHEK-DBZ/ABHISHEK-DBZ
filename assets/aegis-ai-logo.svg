<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAegis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#180c2e" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowAegis" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .sweep-line {
        transform-origin: 256px 205px;
        animation: radarSweep 5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="36" fill="url(#bgGradAegis)" />
  <rect width="504" height="504" x="4" y="4" rx="34" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.35" />

  <!-- Radar HUD Circle -->
  <g transform="translate(256, 205)">
    <circle r="95" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
    <circle r="65" fill="#090514" stroke="#00f0ff" stroke-width="2" />
    <circle r="35" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.6" />
    
    <!-- Crosshairs -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#00f0ff" stroke-width="1" opacity="0.5" />
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#00f0ff" stroke-width="1" opacity="0.5" />
    
    <!-- Radar Sweep Line -->
    <line x1="0" y1="0" x2="65" y2="0" stroke="#00f0ff" stroke-width="2.5" class="sweep-line" filter="url(#glowAegis)" />

    <!-- DNA Helix / Forensic Nodes -->
    <circle cx="-25" cy="-20" r="5" fill="#ec4899" filter="url(#glowAegis)" />
    <circle cx="20" cy="15" r="4.5" fill="#00f0ff" filter="url(#glowAegis)" />
    <circle cx="10" cy="-35" r="3.5" fill="#a855f7" />
    <circle cx="-15" cy="30" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="256" y="375" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">AEGIS-AI</text>
  <text x="256" y="410" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="17" fill="#a855f7" text-anchor="middle" letter-spacing="3">FORENSIC &amp; CRIME DNA ENGINE</text>
  <text x="256" y="448" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="2">MULTI-AGENT INTELLIGENCE SWARM</text>
</svg>
